<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>

    <form action="viewstudent.html">

        <h1>Add Student</h1>

        <label for="name">Enter Name</label>
        <input type="text" id="name" placeholder="Enter Name" required>

        <label for="rollno">Enter Roll Number</label>
        <input type="text" id="rollno" placeholder="Enter Roll Number" required>

        <label for="branch">Enter Branch</label>
        <input type="text" id="branch" placeholder="Enter Branch" required>

        <label for="cgpa">Enter CGPA</label>
        <input type="number" id="cgpa" placeholder="Enter CGPA" required>

        <button type="submit">Add Student</button>

    </form>

</body>
</html>
